[project]
name = "aftershock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.15",
    "django-filter>=24.0",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.2",
    "celery[redis]>=5.4",
    "gunicorn>=23.0",
    "httpx>=0.27",
    "black>=26.10.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "respx>=0.21",
]

[tool.uv]
package = false   # a Django service, not an installable library

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
